<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>sign · transparent PNG</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }
    body {
      background: #eef2f5;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 8px;
    }
    .card {
      max-width: 600px;
      width: 100%;
      background: white;
      border-radius: 28px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.05);
      padding: 20px 16px 24px;
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 500;
      color: #0a2c3d;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }
    .sub {
      color: #2f5e74;
      font-size: 0.9rem;
      margin-bottom: 24px;
      border-left: 3px solid #2b95c6;
      padding-left: 12px;
    }
    /* upload row */
    .upload-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .upload-btn {
      background: #0f4b5e;
      border: none;
      color: white;
      font-size: 1rem;
      font-weight: 500;
      padding: 12px 18px;
      border-radius: 50px;
      cursor: pointer;
      border: 1px solid #1a6c8a;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: 0.15s;
      flex-shrink: 0;
      touch-action: manipulation;
    }
    .upload-btn:active {
      background: #1e6e85;
      transform: scale(0.97);
    }
    .file-status {
      flex: 1;
      min-width: 140px;
      display: flex;
      align-items: center;
      background: #f4f8fa;
      border-radius: 50px;
      padding: 4px 4px 4px 16px;
      border: 1px solid #cbdae2;
      font-size: 0.9rem;
      gap: 6px;
    }
    .file-name {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: #0f3b4a;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 1.6rem;
      line-height: 1;
      color: #6b8b9c;
      cursor: pointer;
      padding: 0 10px;
      border-radius: 50%;
      transition: 0.1s;
      touch-action: manipulation;
    }
    .close-btn:active {
      color: #b11;
      background: rgba(0,0,0,0.04);
    }
    #upload {
      display: none;
    }
    /* canvas */
    .canvas-wrap {
      background: repeating-conic-gradient(#d1dbe3 0% 25%, #c2ced8 0% 50%) 50% / 24px 24px;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #bccfd9;
    }
    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      background: transparent;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    /* controls */
    .controls {
      background: #fafcfd;
      border-radius: 24px;
      padding: 16px;
      border: 1px solid #cfdee7;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .slider-label {
      font-weight: 500;
      color: #1a495a;
      min-width: 60px;
    }
    #threshold {
      flex: 2;
      min-width: 180px;
      height: 8px;
      border-radius: 20px;
      background: #d0dee6;
      -webkit-appearance: none;
      appearance: none;
    }
    #threshold::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 26px;
      height: 26px;
      background: white;
      border: 2px solid #0f4b5e;
      border-radius: 50%;
      box-shadow: 0 2px 6px #0f4b5e66;
      cursor: pointer;
    }
    #thresholdValue {
      background: #0f4b5e;
      color: white;
      padding: 6px 14px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.9rem;
      min-width: 55px;
      text-align: center;
    }
    .crop-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #e5f0f5;
      padding: 8px 16px;
      border-radius: 40px;
      width: fit-content;
      font-size: 0.95rem;
      color: #0a2c3d;
    }
    .crop-toggle input {
      width: 20px;
      height: 20px;
      accent-color: #1e7e9c;
      margin: 0;
    }
    .download-btn {
      background: #0f4b5e;
      border: none;
      color: white;
      font-size: 1.2rem;
      font-weight: 500;
      padding: 16px 20px;
      border-radius: 60px;
      width: 100%;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      border: 1px solid #1e6e85;
      box-shadow: 0 4px 12px #0f4b5e40;
      touch-action: manipulation;
    }
    .download-btn:active {
      background: #12657c;
      transform: scale(0.98);
    }
    .hint {
      font-size: 0.75rem;
      color: #567e8f;
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="card">

  <h1>✍️ sign2png</h1>
  <div class="sub">threshold until background fades</div>

  <!-- upload row with close button -->
  <div class="upload-row">
    <label for="upload" class="upload-btn">Upload</label>
    <input type="file" id="upload" accept="image/*">
    <div class="file-status" id="fileStatus">
      <span class="file-name" id="fileName">no file</span>
      <button class="close-btn" id="clearBtn" aria-label="remove file">✕</button>
    </div>
  </div>

  <!-- canvas preview (transparency background) -->
  <div class="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>

  <!-- minimal controls -->
  <div class="controls">
    <div class="slider-row">
      <span class="slider-label">fade</span>
      <input type="range" id="threshold" min="0" max="255" value="200" step="1">
      <span id="thresholdValue">200</span>
    </div>

    <div class="crop-toggle">
      <input type="checkbox" id="autoCrop" checked>
      <label for="autoCrop">auto‑crop</label>
    </div>

    <button class="download-btn" id="downloadBtn">
      ⬇️ PNG
    </button>
    <div class="hint">dark = keep · light = transparent</div>
  </div>

</div>

<script>
  (function() {
    // UI elements
    const fileInput = document.getElementById('upload');
    const fileNameSpan = document.getElementById('fileName');
    const clearBtn = document.getElementById('clearBtn');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const thresholdSlider = document.getElementById('threshold');
    const thresholdValue = document.getElementById('thresholdValue');
    const autoCropCheck = document.getElementById('autoCrop');
    const downloadBtn = document.getElementById('downloadBtn');

    // stored original (opaque) image data
    let originalImageData = null;  // ImageData
    let originalWidth = 0, originalHeight = 0;
    const MAX_DIM = 1200;

    // helper: scale preserving aspect
    function getScaledDimensions(w, h) {
      if (w <= MAX_DIM && h <= MAX_DIM) return { width: w, height: h };
      const ratio = Math.min(MAX_DIM / w, MAX_DIM / h);
      return { width: Math.round(w * ratio), height: Math.round(h * ratio) };
    }

    // reset everything (clear file)
    function resetToEmpty() {
      originalImageData = null;
      canvas.width = 1;
      canvas.height = 1;
      ctx.clearRect(0, 0, 1, 1);
      fileNameSpan.textContent = 'no file';
      fileInput.value = '';          // clear input
      thresholdSlider.value = 200;
      thresholdValue.textContent = 200;
    }

    // process image with current threshold & crop
    function processImage() {
      if (!originalImageData) return;

      const thresh = parseInt(thresholdSlider.value, 10);
      thresholdValue.textContent = thresh;
      const doCrop = autoCropCheck.checked;

      const src = originalImageData.data;
      const w = originalImageData.width;
      const h = originalImageData.height;

      // copy pixel data
      const processed = new ImageData(new Uint8ClampedArray(src), w, h);
      const px = processed.data;

      // threshold: light -> transparent
      for (let i = 0; i < px.length; i += 4) {
        const r = px[i], g = px[i+1], b = px[i+2];
        const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        px[i+3] = lum > thresh ? 0 : 255;
      }

      // auto‑crop
      if (doCrop) {
        let minX = w, minY = h, maxX = 0, maxY = 0;
        let hasPixel = false;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            if (px[(y * w + x) * 4 + 3] !== 0) {
              hasPixel = true;
              if (x < minX) minX = x;
              if (y < minY) minY = y;
              if (x > maxX) maxX = x;
              if (y > maxY) maxY = y;
            }
          }
        }
        if (hasPixel && maxX >= minX && maxY >= minY) {
          const cw = maxX - minX + 1;
          const ch = maxY - minY + 1;
          const cropped = new ImageData(cw, ch);
          const dst = cropped.data;
          for (let y = 0; y < ch; y++) {
            const srcRowStart = ((minY + y) * w + minX) * 4;
            const dstRowStart = y * cw * 4;
            dst.set(px.subarray(srcRowStart, srcRowStart + cw * 4), dstRowStart);
          }
          canvas.width = cw;
          canvas.height = ch;
          ctx.putImageData(cropped, 0, 0);
          return;
        }
      }
      // no crop or no opaque pixels
      canvas.width = w;
      canvas.height = h;
      ctx.putImageData(processed, 0, 0);
    }

    // load image from file
    function loadImage(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const dims = getScaledDimensions(img.width, img.height);
          const offCanvas = new OffscreenCanvas(dims.width, dims.height);
          const offCtx = offCanvas.getContext('2d');
          offCtx.drawImage(img, 0, 0, dims.width, dims.height);
          const imgData = offCtx.getImageData(0, 0, dims.width, dims.height);
          // force opaque (if image had alpha, flatten)
          const px = imgData.data;
          for (let i = 3; i < px.length; i += 4) px[i] = 255;
          originalImageData = imgData;
          originalWidth = dims.width;
          originalHeight = dims.height;
          fileNameSpan.textContent = file.name.length > 25 ? file.name.slice(0,22)+'…' : file.name;
          processImage();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // event listeners
    fileInput.addEventListener('change', (e) => {
      const f = e.target.files[0];
      if (f) loadImage(f);
    });

    clearBtn.addEventListener('click', () => {
      resetToEmpty();
    });

    thresholdSlider.addEventListener('input', () => {
      thresholdValue.textContent = thresholdSlider.value;
      if (originalImageData) processImage();
    });

    autoCropCheck.addEventListener('change', () => {
      if (originalImageData) processImage();
    });

    downloadBtn.addEventListener('click', () => {
      if (!originalImageData) {
        alert('Upload a signature first.');
        return;
      }
      const link = document.createElement('a');
      link.download = 'signature.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // initial reset
    resetToEmpty();
  })();
</script>
</body>
</html>
